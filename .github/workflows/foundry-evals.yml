name: Foundry Evals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/azure_agent_harness/agents/**"
      - "src/azure_agent_harness/tools/**"
      - "src/azure_agent_harness/policies/**"
      - "llmops/**"

permissions:
  contents: read
  id-token: write

jobs:
  eval:
    # Configure a protected GitHub Environment named `foundry-evals` with
    # federated Azure authentication before enabling this gate as required.
    environment: foundry-evals
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_FOUNDRY_EVALS == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install
        run: pip install -e ".[dev,foundry]"
      - name: Deterministic eval precheck
        run: python -m azure_agent_harness.llmops.local_eval
      - name: Foundry quality gate
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
        run: python -m azure_agent_harness.llmops.run_foundry_eval
