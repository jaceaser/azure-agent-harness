[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "azure-agent-harness"
version = "0.1.0"
description = "Enterprise-grade starter harness for Microsoft Agent Framework applications on Azure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Azure Agent Harness Contributors" }]
keywords = ["agents", "azure", "microsoft-foundry", "llmops", "mcp", "opentelemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "agent-framework>=1.0.0",
  "agent-framework-foundry>=1.0.0",
  "azure-identity>=1.19.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.10.0",
  "PyYAML>=6.0.2",
  "opentelemetry-api>=1.29.0",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
foundry = [
  "azure-monitor-opentelemetry>=1.6.0",
]
foundry-hosting = [
  "agent-framework-foundry-hosting>=1.0.0b261002",
  "azure-monitor-opentelemetry>=1.6.0",
]
functions = [
  "agent-framework-azurefunctions>=1.0.0b260922,<1.1",
  "azure-functions>=1.21.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
]

[project.urls]
Repository = "https://github.com/YOUR_ORG/azure-agent-harness"
Issues = "https://github.com/YOUR_ORG/azure-agent-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_agent_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
